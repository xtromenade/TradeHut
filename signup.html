<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TradeHut</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        .auth-wrap { min-height: 100vh; display: grid; place-items: center; background: var(--light-gray); padding: 30px; }
        .auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 28px; }
        .auth-title { text-align: center; margin-bottom: 18px; color: var(--primary-color); }
        .auth-form .form-row { margin-bottom: 14px; }
        .auth-form input { width: 100%; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 15px; }
        .auth-form button { width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .auth-form button:hover { background: #142150; }
        .auth-alt { text-align: center; margin-top: 12px; font-size: 14px; }
        .error { color: #b91c1c; background:#fee2e2; border:1px solid #fecaca; padding:10px; border-radius:8px; margin-bottom:12px; display:none }
        .success { color: #065f46; background:#d1fae5; border:1px solid #a7f3d0; padding:10px; border-radius:8px; margin-bottom:12px; display:none }
    </style>
    <script>
        const API_BASE = '';
        async function handleSignup(e){
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value.trim();
            const err = document.getElementById('error');
            const ok = document.getElementById('ok');
            err.style.display = 'none'; ok.style.display = 'none';
            try {
                const res = await fetch(API_BASE + '/api/auth/signup', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ email, password, full_name }) });
                const data = await res.json();
                if(!res.ok){ err.textContent = data.error || 'Signup failed'; err.style.display='block'; return; }
                ok.textContent = 'Account created. Redirecting...'; ok.style.display='block';
                setTimeout(()=> location.href = 'dashboard.html', 700);
            } catch(e){ err.textContent = 'Network error'; err.style.display='block'; }
        }
    </script>
 </head>
 <body>
    <div class="auth-wrap">
        <div class="auth-card">
            <h2 class="auth-title">Create your TradeHut account</h2>
            <div id="error" class="error"></div>
            <div id="ok" class="success"></div>
            <form class="auth-form" onsubmit="handleSignup(event)">
                <div class="form-row"><input id="full_name" type="text" placeholder="Full name" autocomplete="name"></div>
                <div class="form-row"><input id="email" type="email" placeholder="Email" autocomplete="email" required></div>
                <div class="form-row"><input id="password" type="password" placeholder="Password" minlength="6" required></div>
                <button type="submit">Sign Up</button>
            </form>
            <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
 </body>
 </html>
