<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TradeHut</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        .dash-wrap { min-height: 100vh; background:#f7f9fb; }
        .dash-nav { background: var(--primary-color); color:#fff; padding: 12px 20px; display:flex; align-items:center; justify-content:space-between; }
        .dash-nav a { color:#fff; text-decoration:none; margin-left:12px }
        .dash-main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card { background:#fff; border:1px solid #eef2f7; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.05); padding:18px; }
        .grid { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px }
        .col-8 { grid-column: span 8; }
        .col-4 { grid-column: span 4; }
        @media (max-width: 900px){ .grid{ grid-template-columns:1fr } .col-8,.col-4{ grid-column: auto } }
        .list { width:100%; border-collapse: collapse; }
        .list th,.list td{ padding:10px; border-bottom:1px solid #f0f3f7; text-align:left }
        .pay-form { display:flex; gap:10px; flex-wrap:wrap; }
        .pay-form input, .pay-form select { padding:10px 12px; border:1px solid #e5e7eb; border-radius:8px }
        .btn { padding:10px 14px; border-radius:8px; border:none; background:var(--secondary-color); color:var(--primary-color); font-weight:600; cursor:pointer }
    </style>
    <script>
        const API_BASE = '';
        async function fetchMe(){
            const res = await fetch(API_BASE + '/api/auth/me', { credentials:'include' });
            if(res.status === 401){ location.href = 'login.html'; return null; }
            return await res.json();
        }
        async function fetchInvestments(){
            const res = await fetch(API_BASE + '/api/investments', { credentials:'include' });
            return await res.json();
        }
        async function createCheckout(e){
            e.preventDefault();
            const amount = document.getElementById('amount').value;
            const plan = document.getElementById('plan').value;
            const res = await fetch(API_BASE + '/api/payments/checkout', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ amount_cents: Math.round(Number(amount) * 100), plan }) });
            const data = await res.json();
            if(res.ok && data.url){ window.location = data.url; }
            else alert(data.error || 'Payment failed');
        }
        async function init(){
            const user = await fetchMe(); if(!user) return;
            document.getElementById('welcome').textContent = 'Welcome, ' + (user.full_name || user.email);
            const inv = await fetchInvestments();
            const tbody = document.getElementById('inv-body');
            tbody.innerHTML = inv.map(r => `<tr><td>${r.plan}</td><td>$${(r.amount_cents/100).toFixed(2)}</td><td>${r.status}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`).join('');
        }
        async function logout(){ await fetch(API_BASE + '/api/auth/logout', { method:'POST', credentials:'include' }); location.href = 'login.html'; }
        document.addEventListener('DOMContentLoaded', init);
    </script>
 </head>
 <body>
    <div class="dash-wrap">
        <div class="dash-nav">
            <div><strong>TradeHut</strong></div>
            <div>
                <a href="index.html">Home</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
        <div class="dash-main">
            <div class="card" style="margin-bottom:16px">
                <h2 id="welcome">Welcome</h2>
                <p>Monitor your investments and add funds securely.</p>
            </div>
            <div class="grid">
                <div class="card col-8">
                    <h3>Your Investments</h3>
                    <table class="list">
                        <thead><tr><th>Plan</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead>
                        <tbody id="inv-body"></tbody>
                    </table>
                </div>
                <div class="card col-4">
                    <h3>Add Funds</h3>
                    <form class="pay-form" onsubmit="createCheckout(event)">
                        <select id="plan" required>
                            <option value="Basic">Basic</option>
                            <option value="Pro">Pro</option>
                            <option value="Enterprise">Enterprise</option>
                        </select>
                        <input id="amount" type="number" min="10" step="0.01" placeholder="Amount (USD)" required>
                        <button class="btn" type="submit">Pay with Card</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
 </body>
 </html>
